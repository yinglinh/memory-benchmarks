version: "v1.1"

llm:
  provider: deepseek
  config:
    model: deepseek-chat
    api_key: ${OPENAI_API_KEY}
    deepseek_base_url: https://api.deepseek.com
    temperature: 0.1
    max_tokens: 2000

embedder:
  provider: huggingface
  config:
    model: all-MiniLM-L6-v2
    embedding_dims: 384

vector_store:
  provider: qdrant
  config:
    host: qdrant
    port: 6333
    collection_name: locomo_memories
    embedding_model_dims: 384

history_db_path: /app/history/history.db
